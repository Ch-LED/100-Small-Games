; Simon tuning values. Colors are 6-digit hex.
; Loaded by scripts/simon_settings.gd at runtime.

[field]
bg_color="0C1014"
hub_color="1A2028"
; one colour per pad, in PAD_UP / PAD_RIGHT / PAD_DOWN / PAD_LEFT order.
; A pad at rest is this colour darkened by `dim_amount`; lighting up shows the
; colour at full strength. Brightening toward white instead would wash the hue
; out (red turns pink) and read as "faded" rather than "lit".
pad_colors=["2ECC71", "E74C3C", "F1C40F", "3498DB"]
dim_amount=0.62
outer_radius=236.0
inner_radius=96.0
; angular slit left between neighbouring pads, in degrees
gap_deg=5.0
; points per arc; higher is smoother (the pads are pie slices, not circles)
segments=20

[play]
; seconds for one step of the sequence at round 1, shortened per round
base_step=0.62
step_decay=0.018
min_step=0.24
; fraction of a step spent lit; the rest is the gap before the next step
flash_ratio=0.62
; sequence length when a run starts
start_length=1
; how long a pad stays lit after the player presses it
input_flash=0.18
; pause on the failure before the result screen appears
fail_pause=0.9

[overlay]
; sequence dots drawn by the PEEK cheat
dot_size=14.0
dot_gap=8.0
dot_y_margin=64.0
state_font_size=10
; the readout sits below the HUD band and above the disc, so neither collides
state_x=10.0
state_y=72.0

[hud]
font_size=16
margin=24.0
