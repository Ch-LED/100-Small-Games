; 2048 tuning values. Colors are 6-digit hex.
; Loaded by scripts/game2048_settings.gd at runtime.

[board]
; the original's light theme is what makes 2048 recognisable; flip these two to
; a dark pair if you would rather it matched the rest of the collection
bg_color="FAF8EF"
panel_color="BBADA0"
empty_color="CDC1B4"
; chance that a spawned tile is a 4 instead of a 2
spawn_four_chance=0.1
; the board is sized to leave a clear band under it for the banner text, so no
; message ever has to be drawn on top of a tile
tile_size=112.0
gap=12.0
corner_radius=8
; font size by digit count: 1 / 2 / 3 / 4-or-more
font_sizes=[40, 32, 24, 16]

[tiles]
; value -> colour, both ascending and the same length. Anything past the end of
; the table reuses the last entry.
values=[2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
colors=["EEE4DA", "EDE0C8", "F2B179", "F59563", "F67C5F", "F65E3B", "EDCF72", "EDCC61", "EDC850", "EDC53F", "EDC22E", "3C3A32"]
; text is dark on the pale tiles and light on the saturated ones; this is the
; rule, rather than a colour per value
dark_text_color="776E65"
light_text_color="F9F6F2"
dark_text_upto=4

[audio]
; merge tone, indexed by log2(value) - 1, so each doubling steps up a semitone;
; shorter arrays simply reuse the last entry
merge_tones=[220.00, 233.08, 246.94, 261.63, 277.18, 293.66, 311.13, 329.63, 349.23, 369.99, 392.00, 415.30, 440.00]

[hud]
font_size=16
margin=24.0
