; Lights Out tuning values. Colors are 6-digit hex.
; Loaded by scripts/lights_out_settings.gd at runtime.

[board]
bg_color="0A0E18"
; the slab the lights sit on
panel_color="141B2B"
; a light that is off / on
off_color="2A3550"
on_color="FFD24A"
; border for the solution hint ([) and for the keyboard cursor
hint_color="4BD3FF"
cursor_color="F2F5F7"
hint_border=4
cell_size=88.0
gap=12.0
corner_radius=10

[play]
; the puzzle is generated by pressing this many DISTINCT cells from the solved
; state, so it is always solvable; one more per level up to the cap
start_presses=3
presses_step=1
presses_cap=12
; pause on a solved board before the next one appears
solve_pause=1.2

[audio]
; press tone by row, top row lowest
press_tones=[392.00, 440.00, 493.88, 523.25, 587.33]

[hud]
font_size=16
margin=24.0
