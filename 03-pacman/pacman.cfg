; Pac-Man tuning values. Colors are 6-digit hex.
; Loaded by scripts/pacman_settings.gd at runtime.

[field]
bg_color="000000"
; display size of one maze cell in pixels. Art is drawn at 16; 23 fills the
; 720px window height (31 rows * 23 = 713). The side margins hold the HUD.
cell_size=23.0

[assets]
; each art layer exports its own sheet: assets/layers/<layer>.png + .json
; layer names are fixed in pacman_sprites.gd: pacman / ghost_body /
; ghost_eyes / ghost_fright / pellet / fruit
layers_dir="res://03-pacman/assets/layers/"
maze_tiles="res://03-pacman/assets/tilemap.png"
ghost_door="res://03-pacman/assets/ghost_door.png"
layout="res://03-pacman/assets/maze_layout.txt"

[player]
speed=105.0
death_time=1.3
start_lives=3
extra_life_score=10000

[ghost]
speed=95.0
fright_speed=62.0
tunnel_speed=58.0
eaten_speed=210.0
; seconds each ghost waits inside the house before it is released
release_delays=[0.0, 2.0, 5.0, 9.0]
; scatter / chase alternation, seconds (the last scatter runs forever)
mode_durations=[7.0, 20.0, 7.0, 20.0, 5.0, 20.0, 5.0, 100000.0]
fright_time=7.0
fright_time_min=1.0
fright_time_step=0.8

[scoring]
pellet=10
power_pellet=50
ghosts=[200, 400, 800, 1600]

[fruit]
lifetime=9.5
; pellets eaten that trigger each fruit of the level
spawn_at=[70, 170]
types=["cherry", "strawberry", "orange", "apple"]

[level]
; per-level speed-up, capped once `level_cap` is reached
ghost_speed_step=3.0
level_cap=8

[hud]
font_size=24
margin=12.0
