; 10-marble-race tunables. Single source of truth for every number the game
; uses; scripts read these through RaceSettings and hold no magic values.
; Sections are added as the phases that need them arrive — right now only the
; Phase 0 sandbox (ball feel + camera) reads this file.

[ball]
; Sphere radius in metres, and the mass Jolt will integrate.
radius=0.5
mass=1.0
gravity_scale=1.0
; Contact friction with the track. This is the ONLY knob for the traction
; limit (mu*m*g) — Godot has no separate static/kinetic pair. Measured to be
; inert above ~1.8 though: 1.8, 3.5, 7.0 and 20.0 gave bit-identical results
; for top speed, for the straight-line scrub threshold, and for turn drift.
; Below 1.0 it bites hard (0.5 costs 60% of the top speed, 0.05 has no grip
; at all), so the useful range is roughly 0.05-1.8. Set high as headroom in
; case a track material ever combines below it.
friction=1.2
bounce=0.15
; Jolt has no rolling friction (DECISION_LOG 055), and a rolling contact does
; no work, so these damps are the ONLY thing that stops the ball. They are also
; what the "feels like ice" complaint is really about — not friction.
; These are the coasting values. Because driving uses its own pair below, the
; coasting pair can be made firm without costing any top speed — that decoupling
; is the whole point of the switch.
linear_damp=0.14
angular_damp=0.42
; Lower resistance while a steering key is held, so the drive bites. Top speed
; lives here, not in spin_torque: past the traction limit the torque is wasted.
linear_damp_active=0.03
angular_damp_active=0.09
; Space brakes with a constant retarding torque, over the coasting dampers.
; A constant torque takes away a fixed amount of spin per second, so it bites
; harder as the ball slows down; damping would do the opposite. The brake
; wins over a held accelerator rather than fighting it.
brake_torque=3.4
; Below this spin the brake lets go, so the torque cannot turn the spin round
; and leave the ball rocking.
brake_min_spin=0.5
; Torque applied while a steering key is held. Torque above the traction limit
; makes the ball scrub — spinning faster than it travels — and the surplus buys
; no speed at all (measured: torque 16/24/28 all landed on the same top speed).
; At 5 the ball cruises at slip 1.000, i.e. it advances exactly one
; circumference per turn, which is the "gear and rack" grip the feel was missing.
spin_torque=5.0
; Extra torque on top of spin_torque, scaled by how far the steering is from
; the ball's current heading (0 at aligned, turn_boost at a full 180). Turning
; needs more effort than holding a line, and the surge above the traction limit
; on hard corners is what turns into a drift.
turn_boost=1.0
; Below this speed there is no meaningful heading to turn away from, so the
; boost stays off.
min_turn_speed=1.0
; Hard cap enforced in _integrate_forces. Jolt has no speed limit of its own.
; Kept above the achievable terminal speed, otherwise it is dead config.
max_speed=34.0

[camera]
distance=7.0
height=2.5
look_height=0.6
; Position smoothing. Frame-rate independent: 1 - exp(-damp * delta).
follow_damp=8.0
pitch_min=5.0
pitch_max=75.0
mouse_sensitivity=0.0022
; How close the ball must be to the road before the camera takes the road's
; plane as its own. Larger and falling off keeps a lingering tilt; smaller and
; the plane snaps too late entering a banked corner.
align_distance=8.0
; How fast the camera's plane swings over to the road's, in 1/s. Also
; frame-rate independent: 1 - exp(-align_damp * delta).
align_damp=3.0

[play]
; Below the track's lowest point by this much and the ball counts as fallen.
fall_margin=8.0
; Pauses before the level starts over, so it is visible that it ended at all.
restart_delay=1.1
; Held on the finish line after a run, so the time can be read.
finish_pause=2.2

[track]
; Half the road's width. The swept surface folds over itself wherever the
; curve turns tighter than this, so it is the number the curve's minimum turn
; radius has to stay well above (track_01 measures 38.2 m against this 3.0).
half_width=3.0
; The road is a solid slab, not a surface: a zero-thickness shell is something
; a fast ball slides through.
thickness=0.6
; Rings swept along the curve. 252 m over 160 rings is about 1.6 m each, which
; keeps the bank from twisting more than a degree or so between rings.
samples=160
; 6-digit hex, parsed at load.
color="2A3346"
; Bank is derived from the road's curvature, not authored: at or inside
; full_bank_radius the road banks by bank_max, easing off as the turn widens,
; and it ramps itself in and out with the turn.
; Barriers rise out of the road's edges. WHICH stretches have a wall on
; WHICH side is level data, edited on the Track node; these three are only
; how one is drawn.
wall_color="46608C"
wall_thickness=0.35
; Metres of road a wall takes to rise out of the surface and to sink back
; into it. A wall that simply starts is a wall the ball can catch an edge on.
wall_ramp=5.0
; The P overlay: the collision geometry drawn as wireframe. Bright enough to
; read against every colour the road uses.
debug_color="FFE94A"
bank_max=12.0
full_bank_radius=100.0
; Banks below this many degrees are snapped to zero: nearly straight road has
; only noise left in its curvature, and a flickering degree of bank does
; nothing but twist the surface.
bank_deadband=1.5
; Where the run starts and ends, as a fraction along the curve. Both are
; painted into the road as a band of marker-coloured rings, and the finish is
; judged purely by this fraction -- there is no trigger volume anywhere.
start_t=0.02
finish_t=0.97
; How many rings either side of those fractions take the marker colour.
marker_span=0.012
start_color="4BD3FF"
finish_color="FFD24A"

[hud]
font_size=16
margin=28.0
time_color="F2F5F7"
message_color="9FB0C8"

[cheat]
; [ -- an invisible wall along the road's edge: a push back toward the
; centreline that grows the closer the ball gets to the edge. The road also
; keeps supporting the ball past the edge while this is on, so the wall is a
; wall rather than a slightly longer road.
edge_field_depth=1.4
edge_field_strength=280.0
; ] -- flight mode. The arrow keys push the ball instead of spinning it, the
; ball turns fluorescent green, and the dampers are turned right up so it
; drifts to a stop instead of accelerating away.
flight_thrust=350.0
flight_linear_damp=7.0
flight_angular_damp=16.0

flight_max_speed=70.0
; Space in flight cancels momentum outright rather than braking the spin. The
; spin brake only pulls the velocity down as fast as friction holds the two
; together, and friction is capped at mu*m*g -- about 1.8 s from cruising
; speed however hard the torque. Half a second needs the momentum itself.
flight_brake_bleed=3.0
