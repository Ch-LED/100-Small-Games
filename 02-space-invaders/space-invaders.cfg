; Space Invaders tuning values. Colors are 6-digit hex.
; Loaded by scripts/space_settings.gd at runtime.

[scale]
; integer upscale factor applied to the 16x8 source sprites
factor=4

[player]
speed=320.0
bullet_speed=675.0
bottom_margin=44.0
lives=3
invuln_time=1.5
; pause on the wreck before the game-over screen appears
death_pause=1.0
; no shooting allowed for this long at the start of a wave
fire_lock=0.5

[enemy_grid]
cols=11
col_gap=12.0
row_gap=10.0
step_x=8.0
top_margin=96.0

[tick]
; level 1 base period, and the fastest period reached at the last two rows
base_slow=0.80
base_fast=0.25
fast_at_rows=2
per_level_speedup=0.92
; each cleared level starts the formation this many rows lower
level_shift_rows=1.0
; keep at least this many rows between the spawn row and the shield line
level_clear_rows=2.0
; the lowering advances the level along its speed curve; this pushes the curve
; back (in progress units, 0..1) so the opening stays calmer than the raw
; position would imply
level_open_delay=0.08
; seconds after which the time half alone reaches its maximum
time_to_max=60.0
; Split between attrition and elapsed time. Constraint: within one wave the
; attrition term must not outweigh 20s of the time term, i.e.
;   count_share <= time_share * (20 / time_to_max)
; With time_to_max=60 that caps count_share at 0.25.
count_share=0.25
time_share=0.75

[enemy_fire]
; a shot is rolled once every N ticks instead of every tick
fire_interval=3
; expectation-preserving: old rate was 0.70 fail per tick (=0.30 success/tick);
; rolling once per 3 ticks needs 0.90 success per roll -> 0.10 fail
fire_fail_chance=0.1
energy_ratio=0.5
; deliberately slower than the player's laser
energy_bullet_speed=480.0
dart_bullet_speed=340.0

[ufo]
interval_min=18.0
interval_max=30.0
speed=160.0
; vertical position of the UFO band (one enemy row below the very top)
y=90.0
score_min=50
score_max=300
score_step=50

[shield]
count=4
tile_size=6.0
tile_hp=4
; distance from the screen bottom to the top edge of the forts
bottom_margin=210.0

[bullet]
; collision floor in pixels (after upscale): trimmed bullets as thin as 1px
; would otherwise tunnel through without ever triggering a hit
min_width=16.0
min_height=16.0

[cheat]
; The ] super cheat. Player shots home in on the nearest living invader, so a
; wave can be cleared without aiming. `homing_rate` is how fast a shot turns,
; per second (it straightens out and flies on once the formation is empty).
homing_rate=10.0

[score]
squid=40
claude=20
jelly=10

[hud]
score_size=24
margin=16.0
