; Snake tuning values. Colors are 6-digit hex.
; Loaded by scripts/snake_settings.gd at runtime.

[field]
bg_color="101826"
board_color="16202E"
grid_color="22304A"
border_color="3B5A7A"
; border tint while the wall-pass cheat is on (edges no longer kill)
border_color_cheat="2B3B52"
border_width=4.0

[board]
cell_size=40.0
cols=30
rows=15

[snake]
start_length=3
start_dir="right"
; seconds per grid step at level 1, shortened by interval_step per level
base_interval=0.16
interval_step=0.012
min_interval=0.06
growth_per_food=1
body_color="57D97B"
head_color="C8F56A"
dead_color="E0433A"
; gap kept around each segment so the body reads as separate cells
segment_inset=3.0
wrap_edges=false

[food]
color="FF5C5C"
pulse_speed=5.0
pulse_min=0.75
score=10

[level]
foods_per_level=5
level_cap=10

[hud]
font_size=16
margin=24.0
