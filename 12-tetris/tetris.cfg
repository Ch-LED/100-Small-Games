; Tetris tuning values. Colors are 6-digit hex.
; Loaded by scripts/tetris_settings.gd at runtime.
;
; What lives here and what does NOT:
;   - Values the Tetris Guideline fixes (lock delay, reset cap, gravity curve,
;     scoring) are NOT here. They are rules, not taste, and they live in code
;     where the assertion suite can reach them.
;   - What IS here is what the guideline leaves open (DAS/ARR), plus every
;     number this project picked itself.

[board]
; Board geometry (10 x 20 visible, 4 spare rows above for kicks) is fixed by
; the guideline, so it lives in TetrisBoard rather than here. Only how big a
; single cell is drawn is a rendering choice.
cell_size=32

[play]
; guideline: a grounded piece locks after this long, and moving/rotating may
; reset that timer at most `lock_reset_cap` times (otherwise a player can spin
; forever and the game never ends)
lock_delay=0.5
lock_reset_cap=15
; gravity curve is (0.8 - (level-1)*0.007)^(level-1) seconds per row, clamped
; at `level_cap`; `min_fall_per_grid` is the 20G ceiling (rows per frame)
level_cap=20
min_fall_per_grid=20.0
; the sprint ends the instant this many rows are cleared
sprint_lines=40
; seconds per row while the soft-drop key is held
soft_drop_interval=0.05

[input]
; the guideline says nothing about these two; they are pure feel
das=0.13
arr=0.02

[cheat]
; [ time dilation: gravity interval and lock delay are each multiplied by this
time_scale=3.0

[super_cheat]
; ] zero gravity: the active piece stops falling on its own and waits for the
; player. There is deliberately nothing to tune here -- the cheat REMOVES a
; term (gravity) rather than scaling one, which is the whole point of a super
; cheat: break a real constraint, do not turn a knob.


[colors]
; the seven tetromino colours are fixed by the guideline
i="00F0F0"
o="F0F000"
t="A000F0"
s="00F000"
z="F00000"
j="0000F0"
l="F0A000"
; project convention: the super cheat's marker colour
super="00E676"
; board plate and the debug grid overlay
board_bg="0A0E18"
grid="1B2438"

[audio]
move_freq=440.0
rotate_freq=587.33
lock_freq=146.83
level_freq=659.25
; one rising note per line cleared, so a tetris plays four of them
line_freqs=[523.25, 659.25, 783.99, 1046.50]
; the T-spin flourish is its own sound, never confused with a line clear
tspin_freqs=[783.99, 987.77, 1174.66]
; level up, and a new record
level_freqs=[494.00, 587.33, 783.99]
record_freqs=[659.25, 783.99, 1046.50]

[hud]
font_size=16
margin=24.0
