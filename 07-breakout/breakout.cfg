; Breakout tuning values. Colors are 6-digit hex.
; Loaded by scripts/breakout_settings.gd at runtime.

[field]
bg_color="0E1116"
wall_color="2C3946"
ball_color="F2F5F7"
paddle_color="5AD1E6"
; inner bounds of the play area the ball bounces inside
margin_x=40.0
wall_top=40.0
; thickness of the wall rects that sit just outside those bounds
wall_thickness=40.0
; brick grid. The brick width is DERIVED from cols and the play area width, so
; changing cols or margin_x re-tiles automatically.
cols=14
brick_height=26.0
brick_gap=6.0
; distance from wall_top down to the top of the first brick row
brick_top=80.0
; the four lists below must all be the same length: it is the row count.
brick_colors=["E74C3C", "E67E22", "F1C40F", "2ECC71", "1ABC9C", "3498DB", "9B59B6", "95A5A6"]
brick_scores=[7, 7, 5, 5, 3, 3, 1, 1]
; one tone per row, top row highest
row_tones=[1046.50, 880.00, 783.99, 659.25, 523.25, 440.00, 349.23, 261.63]

[ball]
radius=9.0
speed=430.0
; ceiling on the per-paddle-hit speed-up
max_speed=760.0
speed_boost_per_hit=0.012
; keep the ball this far from horizontal, or it can rattle along a wall forever
min_angle_from_horizontal_deg=22.0
; how far the contact normal tilts at the very edge of the paddle (radians)
paddle_curve=0.9
random_deflect_deg=2.0
; launch angle band, measured from horizontal
launch_min_deg=58.0
launch_max_deg=80.0
; how far above the paddle the ball sits while attached
attach_offset=24.0
max_bounces=8

[paddle]
width=140.0
height=18.0
bottom_margin=64.0
max_speed=900.0
; the [ cheat widens the paddle by this factor
cheat_width_scale=1.8

[scoring]
; Bricks broken since the ball last touched the paddle. A run of them is what
; turns the narrow slot behind the brick layer — where the ball rattles back and
; forth — from dead time into the best moment of the level.
; multiplier = clamp(1 + (combo - 1) / combo_step, 1, combo_max)
combo_step=3
combo_max=5
; the brick tone climbs a little with every brick in the run
combo_pitch_per_hit=0.05
combo_pitch_max=1.9

[aim_guide]
; A fixed legend on the paddle: a few short rays, one per contact point, showing
; which way the ball leaves for each. The player always had the agency (ample
; time to reach any contact point); what was missing was a way to SEE the
; mapping from contact point to direction.
;
; A live fan was tried first and rejected in playtesting: a readout that shifts
; while you are already steering with it costs attention, and it jumped around
; as the ball closed in. What is worth learning needs to be learnt only once, so
; the legend does not move (DECISION_LOG 043).
;
; The rays assume the ball arrives straight DOWN. That assumption is what makes
; this a legend rather than a prediction: it teaches the SHAPE of the mapping —
; how far from the centre, and which side — not the exact angle for the ball in
; flight. An oblique arrival shifts every ray by the same reflection.
enabled=true
; contact points across the paddle, from the left shoulder to the right one
rays=5
length=70.0
color="5AD1E6"
alpha=0.30
width=2.0

[play]
lives=3
; pause after losing a ball, before the next launch
life_pause=0.8
; pause on a cleared board before the next one is built
level_pause=1.2
; ball speed multiplier applied per level
speed_step=1.08
level_speedup_cap=8

[hud]
font_size=16
margin=24.0
; the combo badge reads as a reward, so it gets its own warm colour
combo_color="FFC24A"
