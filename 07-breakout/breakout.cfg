; Breakout tuning values. Colors are 6-digit hex.
; Loaded by scripts/breakout_settings.gd at runtime.

[field]
bg_color="0E1116"
wall_color="2C3946"
ball_color="F2F5F7"
paddle_color="5AD1E6"
; inner bounds of the play area the ball bounces inside
margin_x=40.0
wall_top=40.0
; thickness of the wall rects that sit just outside those bounds
wall_thickness=40.0
; brick grid. The brick width is DERIVED from cols and the play area width, so
; changing cols or margin_x re-tiles automatically.
cols=14
brick_height=26.0
brick_gap=6.0
; distance from wall_top down to the top of the first brick row
brick_top=80.0
; the four lists below must all be the same length: it is the row count.
brick_colors=["E74C3C", "E67E22", "F1C40F", "2ECC71", "1ABC9C", "3498DB", "9B59B6", "95A5A6"]
brick_scores=[7, 7, 5, 5, 3, 3, 1, 1]
; one tone per row, top row highest
row_tones=[1046.50, 880.00, 783.99, 659.25, 523.25, 440.00, 349.23, 261.63]

[ball]
radius=9.0
speed=430.0
; ceiling on the per-paddle-hit speed-up
max_speed=760.0
speed_boost_per_hit=0.012
; keep the ball this far from horizontal, or it can rattle along a wall forever
min_angle_from_horizontal_deg=22.0
; how far the contact normal tilts at the very edge of the paddle (radians)
paddle_curve=0.9
random_deflect_deg=2.0
; launch angle band, measured from horizontal
launch_min_deg=58.0
launch_max_deg=80.0
; how far above the paddle the ball sits while attached
attach_offset=24.0
max_bounces=8

[paddle]
width=140.0
height=18.0
bottom_margin=64.0
max_speed=900.0
; the [ cheat widens the paddle by this factor
cheat_width_scale=1.8

[scoring]
; Bricks broken since the ball last touched the paddle. A run of them is what
; turns the narrow slot behind the brick layer — where the ball rattles back and
; forth — from dead time into the best moment of the level.
; multiplier = clamp(1 + (combo - 1) / combo_step, 1, combo_max)
combo_step=3
combo_max=5
; the brick tone climbs a little with every brick in the run
combo_pitch_per_hit=0.05
combo_pitch_max=1.9

[aim_guide]
; A fan over the paddle's top half showing where the ball is about to go. The
; player always had the agency (plenty of time to reach any contact point); what
; was missing was a way to SEE the mapping from contact point to direction.
;
; The fan is not an exact answer. Its spread grows with the Manhattan distance
; from the ball to the paddle: close in, the shot is nearly a line; far away it
; is deliberately vague, because a wall or a brick can still take the ball
; somewhere else before it arrives. The 2-degree random wobble is covered by the
; minimum spread, so the fan is never narrower than the truth.
;
; OFF by default after playtesting: a readout that shifts continuously while you
; are steering with it costs attention and is awkward to use. The mapping it
; shows is worth learning once, which a fixed legend would do better — see
; DECISION_LOG 043. Set it back to true to look at it again.
enabled=false
radius=86.0
; half-width of the fan, in degrees
min_spread_deg=3.0
max_spread_deg=34.0
; the distances over which the spread travels from min to max
near=140.0
far=700.0
color="5AD1E6"
; the faint outer wedge, the firmer core inside it, and the outline
alpha=0.16
core_alpha=0.42
outline_alpha=0.55
; how much of the spread the firmer core covers
core_ratio=0.45
segments=16

[play]
lives=3
; pause after losing a ball, before the next launch
life_pause=0.8
; pause on a cleared board before the next one is built
level_pause=1.2
; ball speed multiplier applied per level
speed_step=1.08
level_speedup_cap=8

[hud]
font_size=16
margin=24.0
; the combo badge reads as a reward, so it gets its own warm colour
combo_color="FFC24A"
