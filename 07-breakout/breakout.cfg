; Breakout tuning values. Colors are 6-digit hex.
; Loaded by scripts/breakout_settings.gd at runtime.

[field]
bg_color="0E1116"
wall_color="2C3946"
ball_color="F2F5F7"
paddle_color="5AD1E6"
; inner bounds of the play area the ball bounces inside
margin_x=40.0
wall_top=40.0
; thickness of the wall rects that sit just outside those bounds
wall_thickness=40.0
; brick grid. Both the ROWS and the COLS come from the level file, and the brick
; width is DERIVED from the column count and the play area width, so a level
; decides its own grid and nothing here needs editing.
brick_height=26.0
brick_gap=6.0
; distance from wall_top down to the top of the first brick row
brick_top=80.0
; how much clear space the brick block must leave above the paddle
brick_clearance=40.0
; --- how a brick looks and pays, indexed by LAYERS ---
; A level file's digit is how many hits a brick takes. All three lists are
; indexed by that same number, and all three must be the same length.
; COLORS index by hits REMAINING, so a brick visibly changes as it is worn down:
; [0] is a one-hit brick, [1] a two-hit one with one layer gone, and so on.
layer_colors=["95A5A6", "3498DB", "F1C40F"]
; SCORES and TONES index by THE LAYER STRUCK: [0] is the last layer of any brick
; (and the only layer of a one-hit brick), [1] the layer under a two-hit brick's
; skin. So the kill is always index 0 -- which is where to put the sound you want
; to hear every time a brick goes, and the biggest score.
layer_scores=[3, 5, 9]
layer_tones=[783.99, 659.25, 523.25]

[ball]
radius=9.0
speed=430.0
; ceiling on the per-paddle-hit speed-up
max_speed=760.0
speed_boost_per_hit=0.012
; keep the ball this far from horizontal, or it can rattle along a wall forever
min_angle_from_horizontal_deg=22.0
; how far the contact normal tilts at the very edge of the paddle (radians).
; The outgoing angle off vertical is TWICE this (a bounce doubles a normal's
; tilt), so 0.42 tops out near 48 degrees. Higher values stop reading as a bat
; and start reading as a lens (DECISION_LOG 046).
paddle_curve=0.42
random_deflect_deg=2.0
; launch angle band, measured from horizontal
launch_min_deg=58.0
launch_max_deg=80.0
; how far above the paddle the ball sits while attached
attach_offset=24.0
max_bounces=8
; a swung paddle hits the ball this much harder than a parked one, and may push
; it past [ball] max_speed up to this ceiling
swing_boost=1.35
swing_max_speed=920.0
; the fading line dragged behind a live ball. It lives in Board (world space), so
; the points are absolute positions and the tail stays put as the ball moves.
trail_points=12
trail_width=8.0
trail_alpha=0.45

[paddle]
width=140.0
height=18.0
bottom_margin=64.0
max_speed=900.0
; the [ cheat widens the paddle by this factor
cheat_width_scale=1.8
; The swing. Press space or the left button to lunge: the collision box steps
; up by `swing_reach` for `swing_lunge_time` (a hit up there is smashed away),
; then steps back to rest for `swing_retract_time` (a ball landing on it is
; caught and put back in your hands to aim). `swing_rise_time` is how long the
; drawn face takes to reach the top of the lunge; the box ignores it.
swing_reach=54.0
swing_lunge_time=0.16
swing_retract_time=0.22
swing_rise_time=0.05

[shards]
; Line shards thrown out of a broken brick, in that brick's own row colour.
; Purely visual: they hold no collision and are never queried.
count=7
length=16.0
width=2.0
speed=200.0
; extra random spread on top of the even fan, in degrees
spread_deg=16.0
duration=0.34

[scoring]
; Bricks broken since the ball last touched the paddle. A run of them is what
; turns the narrow slot behind the brick layer — where the ball rattles back and
; forth — from dead time into the best moment of the level.
; multiplier = clamp(1 + (combo - 1) / combo_step, 1, combo_max)
combo_step=3
combo_max=5
; the brick tone climbs a little with every brick in the run
combo_pitch_per_hit=0.05
combo_pitch_max=1.9

[play]
lives=3
; pause after losing a ball, before the next launch
life_pause=0.8
; pause on a cleared board before the next one is built
level_pause=1.2
; ball speed multiplier applied per level
speed_step=1.08
level_speedup_cap=8

[hud]
font_size=16
margin=24.0
; the combo badge reads as a reward, so it gets its own warm colour
combo_color="FFC24A"
