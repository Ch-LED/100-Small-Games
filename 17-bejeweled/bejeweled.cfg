; Bejeweled tuning values. Colors are 6-digit hex.

[board]
rows=8
cols=8
; how many kinds of gem. Six is the classic number: fewer and the board
; matches itself too easily, more and it becomes hard to read at a glance.
kinds=6
; One colour per kind, in order. Shape is derived from the index too, so a
; colour-blind player can tell the gems apart by outline alone.
gem_colors=["FF5252", "FFB300", "FFEB3B", "66BB6A", "42A5F5", "AB47BC"]
cell_size=64.0
bg_color="080B14"
cell_color="161F33"
cell_alt_color="111A2B"
cursor_color="E8EEF9"
hint_color="4BD3FF"
super_color="00E676"
text_color="E8EEF9"
accent_text="4FC3F7"
dim_text="7E8CA8"
; how far a gem is inset from its cell, as a fraction of the cell
gem_inset=0.16

[round]
; Timed, the way the arcade original was. The clock is the whole pressure.
seconds=90

[score]
; points per gem cleared, multiplied by the cascade number
per_gem=10
; how fast the board settles: swap, clear, fall, in seconds
swap_time=0.12
clear_time=0.16
fall_time=0.16

[audio]
swap_freq=440.00
reject_freq=174.61
clear_freqs=[523.25, 587.33, 659.25, 698.46, 783.99, 880.00]
cascade_freq=659.25
over_freq=196.00
record_freqs=[659.25, 783.99, 1046.50]
start_freq=329.63

[hud]
font_size=16
margin=28.0
