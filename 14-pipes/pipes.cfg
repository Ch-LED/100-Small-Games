; Pipes tuning values. Colors are 6-digit hex.
; Loaded by scripts/pipes_settings.gd at startup. Every key has a fallback in
; that file, so a typo here fails quietly -- edit the reader too when adding one.

[board]
bg_color="080B14"
empty_color="141B2B"
; the faint grid, drawn under everything so a cell is readable even when empty
grid_color="22304A"
; one cell, in pixels. The 9x9 boards are the widest the levels get, and this
; keeps them inside the field with room for the HUD.
cell_size=60.0
; the cursor cell and the row/column it shares
cursor_color="2A3B5C"
; how thick a line is, and how big an end dot is, as fractions of a cell
line_width=0.30
dot_scale=0.52
; a dot the line has already reached is drawn hollow: joined, not just present
joined_dot_scale=0.34
; laid over a crossing, so "two colours are here" is legible at a glance
bridge_color="F2F6FF"
; the [ key's answer path, and the ] key's marker colour
hint_color="4BD3FF"
super_color="00E676"
; HUD text: the readout, the numbers that matter, and the help line
text_color="E8EEF9"
accent_text="4FC3F7"
dim_text="7E8CA8"

[net]
; The pipe modes (turn / shift / slide) share this look. A piece is drawn in
; the plain colour until every one of its openings faces another opening, at
; which point it turns bright -- so progress is visible without a counter.
pipe_color="8AA0C8"
joined_pipe_color="4BD3FF"
; a pinned piece cannot be moved and is drawn darker to say so
pinned_pipe_color="4A5A78"
; Thickness of a pipe as a fraction of a cell. The hub at a joint is drawn at
; half of this, so its diameter is exactly the pipe's width and a corner reads
; as a bend rather than as a lump.
pipe_width=0.34
; Alpha (0-255) of the fill under the pointer. It has to say "this cell" without
; competing with the pipes, which means very faint indeed.
hover_alpha=10

[colors]
; One entry per colour, in the order the generator numbers them. A deal with
; more colours than this reuses the last entry, so keep it longer than any
; board needs.
palette=["FF5252", "FFCA28", "66BB6A", "29B6F6", "AB47BC", "FF7043", "26C6DA", "8D6E63", "EC407A", "D4E157", "BA68C8", "4DB6AC"]

[levels]
; One entry per level: the grid side, and how many colours to cut it into.
; Past the end of the table the last entry repeats, so the game never runs out.
sides=[5, 6, 6, 7, 7, 8, 8, 9, 9, 9]
pairs=[4, 5, 5, 6, 6, 7, 7, 8, 8, 9]
; Shortest run the generator may leave as a colour. Two would be a colour with
; nothing to solve, so the deals are cut at three.
min_run=3

[net_levels]
; The three pipe modes share this table. `sides` comes from [levels] -- the
; same board sizes -- and these two say how far the deal is wrecked.
; How many moves the generator makes. More moves means a board further from
; solved, which is the whole difficulty curve for these modes.
shuffle_steps=[10, 14, 18, 23, 28, 34, 40, 47, 54, 62]
; Empty cells on the sliding boards. Sliding needs somewhere to slide to, and
; without gaps the wreck move does nothing at all.
slide_gaps=[3, 3, 4, 4, 5, 5, 6, 6, 7, 7]

[audio]
draw_freq=440.00
join_freq=587.33
clear_freq=196.00
blocked_freq=138.59
solved_freqs=[523.25, 659.25, 783.99, 1046.50]
record_freqs=[659.25, 783.99, 1046.50]
start_freq=329.63

[hud]
font_size=16
margin=28.0
