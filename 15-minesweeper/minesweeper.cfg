; Minesweeper tuning values. Colors are 6-digit hex.
; Loaded by scripts/minesweeper_settings.gd at startup. Every key has a
; fallback in that file, so a typo here fails quietly.

[board]
bg_color="080B14"
; an unopened cell: raised, lighter than the field, with a bright top edge
hidden_color="2A3B5C"
hidden_edge="3F5A8C"
; an opened cell: the floor underneath
open_color="141B2B"
grid_color="0A1020"
; 1 through 8, in the order the numbers are usually coloured
number_colors=["4FC3F7", "66BB6A", "E94560", "AB47BC", "FFB300", "26C6DA", "FF7043", "E8EEF9"]
flag_color="E94560"
mine_color="E8EEF9"
; a flag on a cell that turned out not to be a mine, shown at the end
wrong_flag_color="7E8CA8"
; the cheat marker colour, fixed project-wide (CONSTITUTION 八)
super_color="00E676"
cursor_color="4FC3F7"
text_color="E8EEF9"
accent_text="4FC3F7"
dim_text="7E8CA8"
cell_size=28.0
; how thick the raised edge on an unopened cell is, as a fraction of a cell
edge_scale=0.09

[levels]
names=["BEGINNER", "INTERMEDIATE", "EXPERT"]
rows=[9, 16, 16]
cols=[9, 16, 30]
mines=[10, 40, 99]

[audio]
open_freq=523.25
flag_freq=392.00
unflag_freq=329.63
boom_freq=98.00
win_freqs=[523.25, 659.25, 783.99, 1046.50]
record_freqs=[659.25, 783.99, 1046.50]
start_freq=329.63

[hud]
font_size=16
margin=28.0
