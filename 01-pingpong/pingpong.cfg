; Pong tuning values. Colors are 6-digit hex.
; Loaded by scripts/pong_settings.gd at runtime.

[field]
bg_color="3A3A3A"
; top/bottom boundary lines
wall_color="FFFFFF"
wall_alpha=0.30

[center_line]
color="FFFFFF"
alpha=0.45
width=8.0

[ball]
radius=11.0
speed=520.0
color="FF8A5C"
color_alpha=0.85
; speed grows by this fraction each paddle hit
speed_boost_per_hit=0.05
; seconds of idle at center before each serve
serve_pause=2.0
serve_min_deg=12.0
serve_max_deg=32.0
; curve = rotation (rad) applied to the bounce normal per unit of edge offset
reflect_curve=0.55
random_deflect_deg=4.0
; the bounce direction keeps at least this angle from the vertical, so a rally
; can never lock into a near-vertical loop between the top and bottom walls
min_bounce_angle_from_vertical_deg=40.0

[paddle]
width=16.0
height=120.0
; distance from the side field edge to the paddle front
edge_distance=36.0
max_speed=900.0
left_color="2E6BD6"
right_color="E0433A"

[ai]
; exponential follow rate for the paddle's chase; higher = tighter, lower =
; easier to beat. The paddle closes this fraction of the gap per second.
follow_rate=6.0
; stop fussing once roughly lined up with the ball
dead_zone=6.0

[cheat]
; The ] super cheat. Once the ball is travelling back toward the player's paddle
; the only things left for it to meet are that paddle and the walls, so it steers
; itself onto the paddle's centre: the player cannot be scored on.
; `rate` is turns per second at range; `boost` is how much faster it gets over
; the last `span` pixels of the crossing. The sharpest turn is always the one
; needed at the end.
homing_rate=6.0
homing_boost=14.0
homing_span=320.0
; The [ cheat: how much longer the player's paddle gets.
paddle_scale=1.9

[scoreboard]
font_size=300.0
alpha=0.38
