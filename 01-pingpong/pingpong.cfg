; Pong tuning values. Colors are 6-digit hex.
; Loaded by scripts/pong_settings.gd at runtime.

[field]
bg_color="808080"

[center_line]
color="FFFFFF"
alpha=0.45
width=8.0

[ball]
radius=11.0
speed=520.0
color="FF8A5C"
color_alpha=0.85
; speed grows by this fraction each paddle hit
speed_boost_per_hit=0.05
; seconds of idle at center before each serve
serve_pause=2.0
serve_min_deg=12.0
serve_max_deg=32.0
; curve = rotation (rad) applied to the bounce normal per unit of edge offset
reflect_curve=0.55
random_deflect_deg=4.0
min_dir_x=0.30

[paddle]
width=16.0
height=120.0
; distance from the side field edge to the paddle front
edge_distance=36.0
max_speed=900.0
left_color="2E6BD6"
right_color="E0433A"

[ai]
cooldown_enabled=true
; command freeze before the pending direction is applied (player-perceived reaction)
reaction_min=0.08
reaction_max=0.12
dead_zone=6.0

[scoreboard]
font_size=300.0
alpha=0.38
