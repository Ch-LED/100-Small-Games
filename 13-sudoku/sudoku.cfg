; Sudoku tuning values. Colors are 6-digit hex.
; Loaded by scripts/sudoku_settings.gd at startup. Every key has a fallback in
; that file, so a typo here fails quietly -- edit the reader too when adding one.

[board]
; dark board on a darker field, matching the rest of the collection
bg_color="080B14"
board_bg="141B2B"
; thin cell separators, and the heavier lines that fence off the nine boxes
line_color="2A3550"
box_line_color="5A6E9E"
; dealt digits read as stone; the player's own entries read as ink
given_color="E8EEF9"
entry_color="4FC3F7"
; a digit that repeats inside its row, column or box
conflict_color="E94560"
; the cursor cell, and the row/column/box it shares -- a hint, not a rule
cursor_color="1E2A44"
peer_color="182034"
; pencil marks, and the candidates the [ key pencils for you
note_color="7E8CA8"
auto_note_color="4BD3FF"
; the super cheat's colour, fixed project-wide (CONSTITUTION 八)
super_color="00E676"
cell_size=56.0

[text]
; font size as a fraction of the cell: the big digit, and a pencil mark
digit_scale=0.62
note_scale=0.22

[generator]
; Blanks target per difficulty, in order. This is a ceiling: the generator
; stops removing once the solution would stop being unique, so the deal can be
; slightly easier than the number here but never harder.
difficulty_names=["EASY", "NORMAL", "HARD"]
difficulty_blanks=[40, 48, 52]

[audio]
fill_freq=523.25
erase_freq=196.00
note_freq=392.00
clash_freq=110.00
complete_freqs=[523.25, 659.25, 783.99, 1046.50]
record_freqs=[659.25, 783.99, 1046.50]
start_freq=329.63

[hud]
font_size=16
margin=28.0
