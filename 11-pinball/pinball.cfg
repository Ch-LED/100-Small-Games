; 11-pinball -- every TUNEABLE number, read by pinball_settings.gd.
;
; Geometry is NOT here. Where the walls run, where the bumpers sit, how long a
; flipper is and how far it swings all come out of the original table's data,
; in table_layout.gd (playbook: the design doc's "参考" section). A copy of any
; of it in this file would be a second place to change one number.
;
; WARNING: the read table in pinball_settings.gd is written by hand, key by
; key. A key added here without being added there is NOT an error -- the
; script's fallback is used silently and the game runs on values nobody chose.

[table]
tilt_deg = 16.0
wall_height = 2.5
; How much fat the collision boxes get on top of the original's wall data.
;
; The original gives walls in TWO shapes and neither is a fat slab: the side
; walls (g286/g287) are closed rectangles already 0.25 across, while the arch
; (g280) is an open polyline, i.e. a centre line with no width at all. This
; value is added to both, so it has to stay small or the rectangles -- which
; need nothing -- end up twice as thick as they should be.
;
; 0.6 was the ball's whole diameter and made the table a pile of overlapping
; slabs. 0.1 is a third of the ball's radius: barely visible, and enough for
; the collision boxes to still meet at corners.
wall_thickness = 0.1

[ball]
mass = 1.0
; The speed lever. Raising the tilt instead would run the table out of angles;
; a heavier ball under the same tilt just accelerates harder.
gravity_scale = 2.0
; Still above the 2/7*tan(tilt) needed to keep a rolling contact from slipping.
friction = 0.10
bounce = 0.35
; Zero: linear_damp is a pure speed thief on a ball that friction already
; stops the moment it starts sliding.
linear_damp = 0.0
angular_damp = 0.02
; 64 is about as far as this can go. The ball covers 1.07 units per physics
; tick here against a flipper test radius of 1.60 -- push past ~90 and the ball
; starts stepping clean over the flipper between ticks (spec 4.3).
max_speed = 64.0

[flipper]
; Feel only. Length, pivot and swing are in table_layout.gd.
radius = 0.35
flip_angular_speed = 14.0
return_angular_speed = 18.0
restitution = 0.45
contact_slack = 1.15

[plunger]
charge_time = 1.1
launch_min_speed = 10.0
launch_max_speed = 42.0

[camera]
; High and nearly straight down: the original is seen almost flat-on, and the
; old 28-degree down-angle was squeezing the table into a short wide trapezoid.
; At 16 degrees the table reads as the long board it is.
height = 28.0
pull_back = 8.0
look_forward = 0.0
fov = 51.0

[hud]
font_size = 18

[rules]
starting_balls = 3

; ── Phase 2 已在用 ──
[score]
bumper = 100
bumper_kick = 13.0
; R2 的机关
target = 25
rollover = 10
kicker = 150
kicker_kick = 20.0
sink = 500
; 球掉进洞后停多久再被吐出来
sink_hold = 0.35
; 从洞里吐出来时给的初速
sink_eject = 18.0

; ── Phase 3 已在用 ──
[cheat]
flipper_length_scale = 1.6

[super_cheat]
; 球被救回来时沿台面向上抛出的速度。绿色标记是代码常量 SUPER_COLOR。
rescue_speed = 38.0
