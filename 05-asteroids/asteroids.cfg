; Asteroids tuning values. Colors are 6-digit hex.
; Loaded by scripts/asteroids_settings.gd at runtime.

[field]
bg_color="0B0F1A"
star_color="2E4166"
star_count=90
star_min=1.0
star_max=2.2
ship_color="E8F1FF"
; ship outline while the invincibility cheat is on
invuln_color="57D97B"
thrust_color="FFB84D"
rock_color="8FA6C8"
saucer_color="FF6B8A"
bullet_color="FFF3B0"

[ship]
; degrees per second while a steer key is held
rotate_speed=250.0
thrust_accel=380.0
; per-second exponential damping on velocity. The arcade original has none and
; coasts forever; 0.45 brings the ship to rest in about 2.5s so a keyboard feels
; controllable. Set 0.0 for the classic drift.
drag=0.45
max_speed=430.0
radius=14.0
lives=3
fire_cooldown=0.16
max_bullets=4
invuln_time=2.2
; pause on the wreck before respawning or ending the game
death_pause=1.6
; do not respawn while a rock is closer than this to the centre
safe_spawn_radius=130.0

[bullet]
speed=680.0
lifetime=1.05
radius=3.0
length=11.0

[rock]
; every three-entry list below is [large, medium, small], picked by size index
radius=[46.0, 26.0, 14.0]
score=[20, 50, 100]
speed_min=[46.0, 72.0, 104.0]
speed_max=[88.0, 132.0, 186.0]
spin_min=[-70.0, -115.0, -165.0]
spin_max=[70.0, 115.0, 165.0]
; each wave multiplies rock speed, capped once `level_speedup_cap` is reached
level_speedup=1.06
level_speedup_cap=8
vertices_min=9
vertices_max=13
; how far a vertex may wander from `radius`, as a fraction of it
jaggedness=0.34

[wave]
start_count=4
count_step=2
count_cap=11

[saucer]
first_delay=9.0
interval_min=16.0
interval_max=28.0
speed=150.0
radius=16.0
score=200
fire_interval=1.35
; chance that a shot is aimed at the ship instead of fired at random
aim_chance=0.55
bullet_speed=420.0
; vertical band the saucer crosses through
y_min=90.0
y_max=300.0

[beat]
; seconds between heartbeats: slow when the field is full, fast when it is empty
slow=1.05
fast=0.26

[fx]
; explosion look. `size_scale` is indexed [large, medium, small] and scales the
; base numbers so a big rock throws a bigger burst than a small one.
shards=9
length=11.0
duration=0.45
spread=140.0
size_scale=[1.35, 1.15, 1.0]
ship_scale=1.5
ship_duration=0.8

[score]
extra_life=10000

[hud]
font_size=16
margin=20.0
; life icons are drawn at this fraction of the ship's radius
lives_icon_scale=0.72
